[project]
name = "groundstation"
version = "0.63.0"
description = "Earth data, agent-ready: an MCP server + Claude skill over the cloud-native geospatial stack (STAC, TiTiler, Gazet)"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Development Seed" }]
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer and moved its import path, so
    # server.py fails on import there. Lift the ceiling with the migration
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "rio-tiler>=9.4.2",
    "playwright>=1.61.0",
    "skyfield>=1.54",
    "rustac>=0.9.17",
    "xarray>=2026.9.0",
    "zarr>=3.4.1",
    "obstore>=0.12.0",
]

[project.urls]
Homepage = "https://developmentseed.org"
Repository = "https://github.com/dannybauman/groundstation"

[project.scripts]
groundstation = "groundstation.server:main"
groundstation-web = "groundstation.web:main"

[dependency-groups]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundstation"]
