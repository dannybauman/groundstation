<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__, a living world</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b0a; font-family: "Roboto Condensed", Bahnschrift, system-ui, sans-serif; color: #f3ede4; }
  #view { position: fixed; inset: 0; }
  #panel { position: absolute; top: 12px; left: 12px; width: 360px; z-index: 2; padding: 12px 16px; box-sizing: border-box;
    background: rgba(21,18,15,.55); backdrop-filter: blur(24px); border-radius: 14px; font-size: 13px; }
  #panel h1 { font-size: 16px; margin: 0 0 6px; }
  #panel p { margin: 0 0 10px; color: rgba(243,237,228,.68); line-height: 1.4; }
  .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .row label { flex: none; width: 92px; color: rgba(243,237,228,.8); }
  .row input[type=range] { flex: 1; accent-color: #E84A2F; }
  .row output { width: 48px; text-align: right; font: 12px "Roboto Mono", Consolas, monospace; color: #E84A2F; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .btns button { flex: 1 1 auto; font: inherit; font-size: 12.5px; padding: 7px 10px; border-radius: 9px; cursor: pointer;
    color: #f3ede4; background: rgba(232,74,47,.14); border: 1px solid rgba(232,74,47,.45); }
  .btns button:hover { background: rgba(232,74,47,.3); }
  .facts { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.12); font: 11px/1.5 "Roboto Mono", Consolas, monospace; color: rgba(243,237,228,.6); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 5; background: #0d0b0a; font-size: 15px; color: rgba(243,237,228,.7); transition: opacity .8s; }
  .tag { position: absolute; z-index: 1; transform: translate(-50%, -100%); pointer-events: none; white-space: nowrap;
    font: 600 12px "Roboto Condensed", Bahnschrift, sans-serif; letter-spacing: .03em; color: #fff; padding: 3px 8px; border-radius: 7px;
    background: rgba(21,18,15,.55); backdrop-filter: blur(8px); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .tag::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 14px; background: rgba(255,255,255,.6); }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="loading">Growing the forest…</div>
<div id="view"></div>
<div id="panel">
  <h1>__TITLE__, a living world</h1>
  <p id="about"></p>
  <div class="row"><label for="tod">Time of day</label><input id="tod" type="range" min="6" max="20" step="0.05" value="16.5"><output id="todv"></output></div>
  <div class="row"><label for="wind">Wind</label><input id="wind" type="range" min="0" max="1" step="0.01" value="0.35"><output id="windv"></output></div>
  <div class="row"><label for="cloud">Cloud shadows</label><input id="cloud" type="range" min="0" max="0.6" step="0.01" value="0.3"><output id="cloudv"></output></div>
  <div class="row"><label for="haze">Haze</label><input id="haze" type="range" min="0" max="1" step="0.01" value="0.4"><output id="hazev"></output></div>
  <div class="btns">
    <button id="goClose">Close in</button>
    <button id="goAcross">Across the land</button>
    <button id="goBack">Pull back</button>
  </div>
  <div class="facts" id="facts"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const DATA = './__WORLD__/';
// a world's data either sits beside its page (fetched) or inside it, as base64
// blocks, so the one file opens anywhere with no server (Groundstation's way)
const inside = (id) => { const el = document.getElementById('w-' + id); return el ? el.textContent.trim() : null; };
const meta = inside('meta') ? JSON.parse(inside('meta')) : await (await fetch(DATA + 'world.json')).json();
const f32 = async (n) => {
  const e = inside(n.replace('.bin', ''));
  if (!e) return new Float32Array(await (await fetch(DATA + n)).arrayBuffer());
  const s = atob(e), b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return new Float32Array(b.buffer);
};
const [coreH, farH, treeData] = await Promise.all([f32('core_heights.bin'), f32('far_heights.bin'), f32('trees.bin')]);
const tex = new THREE.TextureLoader();
const loadTex = (n) => { const e = inside(n.replace('.jpg', '')); return new Promise((res) => tex.load(e ? 'data:image/jpeg;base64,' + e : DATA + n, res)); };
const [corePhoto, farPhoto] = await Promise.all([loadTex('core_photo.jpg'), loadTex('far_photo.jpg')]);

// ── renderer, scene, camera ──
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 250000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.maxDistance = 90000; controls.maxPolarAngle = Math.PI * 0.495;
for (const t of [corePhoto, farPhoto]) { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); }

// LIFE IN EVERY SURFACE: cloud shadows drift over ground, water and trees alike,
// and foliage carries the two-layer wind (trunk gusts, branch flutter)
const U = { uTime: { value: 0 }, uWind: { value: 0.35 }, uCloud: { value: 0.3 } };
const uniforms = U;
const NOISE = `
  float h2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(h2(i), h2(i + vec2(1.0, 0.0)), f.x), mix(h2(i + vec2(0.0, 1.0)), h2(i + 1.0), f.x), f.y); }
  float clouds(vec2 p) { p = p / 2600.0 + uTime * vec2(0.011, 0.004);
    float n = vn(p) * 0.55 + vn(p * 2.1 + 7.3) * 0.3 + vn(p * 4.7 + 1.7) * 0.15; return smoothstep(0.48, 0.78, n); }`;
function living(mat, wind, rock) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uTime: U.uTime, uWind: U.uWind, uCloud: U.uCloud });
    sh.vertexShader = 'uniform float uTime; uniform float uWind; varying vec3 vWP;\n' + (wind ? 'attribute float aLevel; attribute float aPhase; varying float vRnd; varying float vLvl;\n' : '') + sh.vertexShader;
    if (wind) sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vec3 ip = instanceMatrix[3].xyz;
      float rnd = fract(sin(dot(ip.xz, vec2(12.9898, 78.233))) * 43758.5453);
      vRnd = rnd; vLvl = aLevel;
      // a crown a little lopsided, a little more or less droop, a lean of its own
      if (aLevel > 0.5) {
        transformed.x *= 0.82 + 0.36 * fract(rnd * 3.31);
        transformed.z *= 0.82 + 0.36 * fract(rnd * 5.77);
        transformed.y -= length(transformed.xz) * (fract(rnd * 9.13) - 0.35) * 0.35;
      }
      transformed.x += (fract(rnd * 7.19) - 0.5) * 0.07 * transformed.y;
      transformed.z += (fract(rnd * 2.53) - 0.5) * 0.07 * transformed.y;
      float lift = transformed.y * transformed.y;
      float gust = sin(uTime * 1.1 + ip.x * 0.013 + ip.z * 0.011) * 0.7 + sin(uTime * 2.9 + ip.x * 0.07) * 0.3;
      transformed.x += gust * uWind * lift * 0.05;
      transformed.z += gust * uWind * lift * 0.025;
      float flutter = sin(uTime * (4.0 + aPhase * 3.0) + aPhase * 6.283 + ip.x * 0.31 + ip.z * 0.23);
      transformed.y += flutter * uWind * aLevel * 0.004;
      transformed.x += flutter * uWind * aLevel * 0.007;`);
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      #ifdef USE_INSTANCING
        vWP = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
      #else
        vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;
      #endif`);
    sh.fragmentShader = 'uniform float uTime; uniform float uCloud; varying vec3 vWP;\n' + (wind ? 'varying float vRnd; varying float vLvl;\n' : '') + NOISE + String.fromCharCode(10) + sh.fragmentShader.replace('#include <dithering_fragment>', `#include <dithering_fragment>
      gl_FragColor.rgb *= 1.0 - uCloud * clouds(vWP.xz);` + (wind ? `
      gl_FragColor.rgb += vec3(0.05, 0.07, 0.015) * max(0.0, 1.0 - gl_FragColor.g * 3.0);
      gl_FragColor.rgb *= (0.86 + 0.28 * vRnd) * (vLvl > 1.5 ? vec3(1.08, 1.14, 1.0) : vec3(1.0));   // its own shade; lighter new growth at the tips` : ''));
  };
  if (rock) {
    const before = mat.onBeforeCompile;
    mat.onBeforeCompile = (sh) => {
      before(sh);
      sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', `#include <map_fragment>
        vec3 nW = normalize(cross(dFdx(vWP), dFdy(vWP)));
        float steep = 1.0 - abs(nW.y);
        float rk = vn(vWP.xz / 3.5 + vWP.y / 5.0) * 0.55 + vn(vec2(vWP.x + vWP.z, vWP.y) / 1.8) * 0.45;
        vec3 basalt = mix(vec3(0.13, 0.125, 0.12), vec3(0.34, 0.32, 0.29), rk);
        basalt = mix(basalt, vec3(0.22, 0.27, 0.16), smoothstep(0.55, 0.85, vn(vWP.xz / 9.0)) * 0.5);   // moss on the ledges
        diffuseColor.rgb = mix(diffuseColor.rgb, basalt, smoothstep(0.5, 0.78, steep) * 0.9);`);
    };
  }
  mat.customProgramCacheKey = () => 'living-' + (wind ? 'w' : 's') + (rock ? 'r' : '');
  return mat;
}

// world metres: x east, y up, z south (north is -z)
function terrain(heights, gw, gh, ext, stride, photo, dropInside) {
  const w = Math.floor((gw - 1) / stride) + 1, h = Math.floor((gh - 1) / stride) + 1;
  const [x0, y0, x1, y1] = ext;
  const geo = new THREE.PlaneGeometry(x1 - x0, y1 - y0, w - 1, h - 1);
  geo.rotateX(-Math.PI / 2);
  geo.translate((x0 + x1) / 2, 0, -(y0 + y1) / 2);
  const pos = geo.attributes.position;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const k = j * w + i;
    let y = heights[Math.min(gh - 1, j * stride) * gw + Math.min(gw - 1, i * stride)];
    if (dropInside) { const x = pos.getX(k), z = -pos.getZ(k); if (x > dropInside[0] && x < dropInside[2] && z > dropInside[1] && z < dropInside[3]) y -= 6; }
    pos.setY(k, y);
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, living(new THREE.MeshStandardMaterial({ map: photo, roughness: 0.96, metalness: 0 }), false, true));
}
const core = meta.core, far = meta.far;
const [cgw, cgh] = core.grid, cell = (core.extent[2] - core.extent[0]) / cgw;
const cellAt = (x, y) => [Math.floor((x - core.extent[0]) / cell), Math.floor((core.extent[3] - y) / cell)];
const hAt = (i, j) => coreH[Math.max(0, Math.min(cgh - 1, j)) * cgw + Math.max(0, Math.min(cgw - 1, i))];

// ── the river's level, from the lowest ground in the core ──
const sorted = Array.from(coreH).sort((a, b) => a - b);
const waterLevel = sorted[Math.floor(sorted.length * 0.02)] + 0.6;
const hasWater = sorted.filter((v) => v < waterLevel + 0.2).length / sorted.length > 0.05;
const waterY = hasWater ? waterLevel : -1e6;   // with no water, nothing is "by the water"

// ── THE BRIDGE, found in the data: the lidar ground model keeps the deck, so
// any cell well above the river with river on two opposite sides is deck ──
const bridge = (() => {
  if (!hasWater) return null;
  const lmB = meta.landmarks.find((l) => l.focus) || meta.landmarks[0];
  const [bi, bj] = cellAt(lmB.xy[0], lmB.xy[1]), r = Math.round(450 / cell), d = Math.round(45 / cell);
  const pts = [];
  for (let j = bj - r; j <= bj + r; j++) for (let i = bi - r; i <= bi + r; i++) {
    const h = hAt(i, j);
    if (h < waterY + 12) continue;
    const wet = (a, b) => hAt(a, b) < waterY + 3;
    if ((wet(i - d, j) && wet(i + d, j)) || (wet(i, j - d) && wet(i, j + d)) || (wet(i - d, j - d) && wet(i + d, j + d)) || (wet(i - d, j + d) && wet(i + d, j - d))) pts.push([i, j, h]);
  }
  if (pts.length < 20) return null;
  // its line: the principal axis of the deck cells
  let mx = 0, my = 0; for (const [i, j] of pts) { mx += i; my += j; } mx /= pts.length; my /= pts.length;
  let sxx = 0, syy = 0, sxy = 0; for (const [i, j] of pts) { sxx += (i - mx) ** 2; syy += (j - my) ** 2; sxy += (i - mx) * (j - my); }
  const ang = 0.5 * Math.atan2(2 * sxy, sxx - syy), ux = Math.cos(ang), uy = Math.sin(ang);
  let t0 = Infinity, t1 = -Infinity; const hs = [];
  for (const [i, j, h] of pts) { const t = (i - mx) * ux + (j - my) * uy; t0 = Math.min(t0, t); t1 = Math.max(t1, t); hs.push(h); }
  hs.sort((a, b) => a - b);
  // the deck back to river, so the curtain the ground model drew is gone
  for (const [i, j] of pts) coreH[j * cgw + i] = waterY - 1;
  const toWorld = (i, j) => new THREE.Vector3(core.extent[0] + (i + 0.5) * cell, 0, -(core.extent[3] - (j + 0.5) * cell));
  return { a: toWorld(mx + ux * (t0 - 8), my + uy * (t0 - 8)), b: toWorld(mx + ux * (t1 + 8), my + uy * (t1 + 8)), deck: hs[Math.floor(hs.length * 0.5)] };
})();

// WATERFALLS, carved first (2026-10-31: "the main distinguishing feature ... would
// be the waterfall. and it should be realistic and awesome"). Every fall
// OpenStreetMap knows in the core: its lip where the map puts it, facing the way
// its stream runs. The 30 m terrain blurs a cliff into a slope, so each fall cuts
// its own amphitheatre: a sheer wall from the lip to its pool, the floor running
// on to the next fall downstream (Multnomah's two tiers) or easing back out.
const FALLS = (Array.isArray(meta.features) ? meta.features : []).filter((x) => x.kind === 'waterfall' && x.h >= 4);
const carved = new Uint8Array(cgw * cgh);
for (const fl of FALLS) {
  const [lx, ly] = fl.xy, [ci, cj] = cellAt(lx, ly);
  let top = -Infinity; const rr = Math.round(15 / cell);
  for (let dj = -rr; dj <= rr; dj++) for (let di = -rr; di <= rr; di++) top = Math.max(top, hAt(ci + di, cj + dj));
  fl.lipY = top; fl.d = new THREE.Vector2(fl.dir[0], fl.dir[1]).normalize(); fl.side = new THREE.Vector2(-fl.d.y, fl.d.x);
}
// a fall whose lip lies just downstream of another, in line with it, is its next tier
for (const fl of FALLS) {
  let next = null, best = 160;
  for (const o of FALLS) {
    if (o === fl) continue;
    const vx = o.xy[0] - fl.xy[0], vy = o.xy[1] - fl.xy[1], dist = Math.hypot(vx, vy);
    if (dist < best && (vx * fl.d.x + vy * fl.d.y) / dist > 0.6) { next = o; best = dist; }
  }
  fl.next = next; fl.len = next ? best : Math.max(28, fl.h * 0.3);
}
FALLS.sort((a, b) => b.lipY - a.lipY);
for (const fl of FALLS) {
  fl.poolY = fl.lipY - fl.h;
  if (fl.next) fl.next.lipY = Math.min(fl.next.lipY, fl.poolY + 0.5);   // the next tier starts at this one's pool
}
for (const fl of FALLS) {
  const reach = fl.len + (fl.next ? 0 : 60), half = (s) => 14 + fl.w + s * 0.35;
  const i0 = cellAt(fl.xy[0] - reach - 60, 0)[0], i1 = cellAt(fl.xy[0] + reach + 60, 0)[0];
  const j0 = cellAt(0, fl.xy[1] + reach + 60)[1], j1 = cellAt(0, fl.xy[1] - reach - 60)[1];
  for (let j = Math.max(0, j0); j <= Math.min(cgh - 1, j1); j++) for (let i = Math.max(0, i0); i <= Math.min(cgw - 1, i1); i++) {
    const x = core.extent[0] + (i + 0.5) * cell - fl.xy[0], y = core.extent[3] - (j + 0.5) * cell - fl.xy[1];
    const s = x * fl.d.x + y * fl.d.y, t = Math.abs(x * fl.side.x + y * fl.side.y);
    if (s < 0 || s > reach) continue;
    const edge = THREE.MathUtils.clamp((t - half(s)) / 12, 0, 1);
    if (edge >= 1) continue;
    const tail = fl.next ? 0 : THREE.MathUtils.clamp((s - fl.len) / 60, 0, 1);
    const floor = fl.poolY + (fl.next ? 0 : Math.max(0, s - fl.len) * 0.12);
    const k = j * cgw + i, cut = floor + (coreH[k] - floor) * Math.max(edge * edge, tail * tail);
    if (cut < coreH[k] - 2) carved[k] = 1;
    coreH[k] = Math.min(coreH[k], cut);
  }
}
const carvedAt = (x, y) => { const [i, j] = cellAt(x, y); return i >= 0 && j >= 0 && i < cgw && j < cgh && carved[j * cgw + i] === 1; };

const farMesh = terrain(farH, far.grid[0], far.grid[1], far.extent, 1, farPhoto, core.extent);
const coreMesh = terrain(coreH, cgw, cgh, core.extent, 2, corePhoto, null);
coreMesh.receiveShadow = true;
// the riverbed sits a few metres under the water surface, never at it, so the two do not flicker
if (hasWater) { const p = coreMesh.geometry.attributes.position; for (let k = 0; k < p.count; k++) if (p.getY(k) < waterY + 0.4) p.setY(k, waterY - 3); p.needsUpdate = true; coreMesh.geometry.computeVertexNormals(); }
scene.add(farMesh, coreMesh);

// a living river: ripples from a scrolling normal map catch the sky and the sun
const waterNormals = await new Promise((res) => tex.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r169/examples/textures/waternormals.jpg', res, undefined, () => res(null)));
if (waterNormals) { waterNormals.wrapS = waterNormals.wrapT = THREE.RepeatWrapping; waterNormals.repeat.set(36, 30); }
const water = new THREE.Mesh(new THREE.PlaneGeometry(core.extent[2] - core.extent[0], core.extent[3] - core.extent[1]),
  living(new THREE.MeshStandardMaterial({ color: 0x163236, roughness: 0.06, metalness: 0.35, normalMap: waterNormals, normalScale: new THREE.Vector2(0.32, 0.32), transparent: true, opacity: 0.9 }), false));
water.rotation.x = -Math.PI / 2; water.position.y = hasWater ? waterY : -1e5; water.visible = hasWater; water.receiveShadow = true;
scene.add(water);

// a steel cantilever truss on the line the data drew, deck at the height the data gave
if (bridge) {
  const steel = new THREE.MeshStandardMaterial({ color: 0x7f8a8c, metalness: 0.55, roughness: 0.42 });
  const stone = new THREE.MeshStandardMaterial({ color: 0x8b857c, roughness: 0.9 });
  const parts = [];
  const along = new THREE.Vector3().subVectors(bridge.b, bridge.a), L = along.length(); along.normalize();
  const side = new THREE.Vector3(-along.z, 0, along.x), Y = bridge.deck;
  const P = (t, s, h) => bridge.a.clone().addScaledVector(along, t).addScaledVector(side, s).setY(Y + h);
  const beam = (p, q, r) => {
    const len = p.distanceTo(q), g = new THREE.CylinderGeometry(r, r, len, 4, 1);
    g.translate(0, len / 2, 0); g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), q.clone().sub(p).normalize()));
    g.translate(p.x, p.y, p.z); parts.push(g);
  };
  const deck = new THREE.BoxGeometry(L, 1.4, 11);
  deck.rotateY(-Math.atan2(along.z, along.x)); const mid = bridge.a.clone().lerp(bridge.b, 0.5); deck.translate(mid.x, Y, mid.z);
  // the truss rises over the piers and dips to the ends and the centre, as a cantilever does
  const rise = (t) => { const u = t / L; return 5 + 22 * Math.max(0, 1 - Math.abs(u - 0.3) / 0.22) + 22 * Math.max(0, 1 - Math.abs(u - 0.7) / 0.22) + 6; };
  const step = 14, n = Math.floor(L / step);
  for (const s of [-5.5, 5.5]) for (let k = 0; k < n; k++) {
    const t0 = k * step, t1 = (k + 1) * step;
    beam(P(t0, s, 0.7), P(t1, s, 0.7), 0.35);                       // bottom chord
    beam(P(t0, s, rise(t0)), P(t1, s, rise(t1)), 0.45);             // top chord
    beam(P(t0, s, 0.7), P(t0, s, rise(t0)), 0.3);                   // vertical
    beam(k % 2 ? P(t0, s, 0.7) : P(t0, s, rise(t0)), k % 2 ? P(t1, s, rise(t1)) : P(t1, s, 0.7), 0.28);   // diagonal
  }
  for (let k = 0; k < n; k += 2) beam(P(k * step, -5.5, rise(k * step)), P(k * step, 5.5, rise(k * step)), 0.25);   // overhead bracing
  const truss = new THREE.Mesh(mergeGeometries(parts.map((g) => g.toNonIndexed())), steel);
  const deckMesh = new THREE.Mesh(deck, steel);
  for (const u of [0.3, 0.7]) {
    const c = bridge.a.clone().addScaledVector(along, u * L), pier = new THREE.BoxGeometry(10, Y - waterY + 6, 16);
    pier.rotateY(-Math.atan2(along.z, along.x)); pier.translate(c.x, (Y + waterY - 6) / 2, c.z);
    const pm = new THREE.Mesh(pier, stone); pm.castShadow = pm.receiveShadow = true; scene.add(pm);
  }

  const meshes = SPECIES.map((sp) => { const im = new THREE.InstancedMesh(sp.far, impMat, CAP); im.customDepthMaterial = impDepth; im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(CAP * 3), 3); im.castShadow = im.receiveShadow = true; im.frustumCulled = false; im.count = 0; scene.add(im); return im; });

      if ((X - cx) ** 2 + (Y - cy) ** 2 > R * R || inCore(X, Y) || X < FX[0] || X > FX[2] || Y < FX[1] || Y > FX[3]) continue;
      const [Rr, G, B] = farAt(X, Y);
      if (!isForest(Rr, G, B)) continue;
      const g = farGround(X, Y);
      if (g > 1900) continue;
      const slope = Math.abs(farGround(X + FCW, Y) - farGround(X - FCW, Y)) / (2 * FCW);
      if (slope > 1.1) continue;
      const hh = 24 + hash(i, j, 4) * 30, r = hash(i, j, 5), sp = pickSpecies(g, hh, g < waterY + 14, r);
      const im = meshes[sp], k = counts[sp]; if (k >= CAP) continue;

      const gi = Math.min(FW - 1, Math.max(0, Math.round((X - FX[0]) / FCW))), gj = Math.min(FH - 1, Math.max(0, Math.round((FX[3] - Y) / FCH)));

})();
const farForest = 'streaming';
const farWater = (() => {
  if (!hasWater) return null;
  const W = 2048, H = Math.round(W * (FX[3] - FX[1]) / (FX[2] - FX[0]));
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  const img = x.createImageData(W, H), d = img.data;
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const X = FX[0] + (i + 0.5) / W * (FX[2] - FX[0]), Y = FX[3] - (j + 0.5) / H * (FX[3] - FX[1]);
    if (inCore(X, Y, -60)) continue;

    if (B >= G - 3 && s < 170 && Math.abs(farGround(X, Y) - waterY) < 7) { const k = (j * W + i) * 4; d[k] = d[k + 1] = d[k + 2] = 255; d[k + 3] = 255; }
  }
  x.putImageData(img, 0, 0);
  // the ground under that water sinks a few metres below it, so the two never sit at
  // one height and flicker as the card picks between them (2026-10-31)
  {
    const pos = farMesh.geometry.attributes.position;
    for (let k = 0; k < pos.count; k++) {
      const X = pos.getX(k), Y = -pos.getZ(k);
      if (inCore(X, Y, -60) || pos.getY(k) > waterY + 8 || pos.getY(k) < waterY - 7) continue;
      const i = Math.min(W - 1, Math.max(0, Math.floor((X - FX[0]) / (FX[2] - FX[0]) * W))), j = Math.min(H - 1, Math.max(0, Math.floor((FX[3] - Y) / (FX[3] - FX[1]) * H)));
      if (d[(j * W + i) * 4 + 3]) pos.setY(k, Math.min(pos.getY(k), waterY - 4));
    }
    pos.needsUpdate = true; farMesh.geometry.computeVertexNormals();
  }
  x.filter = 'blur(1.5px)'; x.drawImage(c, 0, 0); x.filter = 'none';
  const mask = new THREE.CanvasTexture(c);
  const nm = waterNormals ? waterNormals.clone() : null;
  if (nm) { nm.wrapS = nm.wrapT = THREE.RepeatWrapping; nm.repeat.set(380, 460); nm.anisotropy = renderer.capabilities.getMaxAnisotropy(); nm.needsUpdate = true; }
  const mat = living(new THREE.MeshStandardMaterial({ color: 0x163236, roughness: 0.06, metalness: 0.35, normalMap: nm, normalScale: new THREE.Vector2(0.16, 0.16), transparent: true, alphaMap: mask, alphaTest: 0.35, depthWrite: true }), false);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(FX[2] - FX[0], FX[3] - FX[1]), mat);
  mesh.rotation.x = -Math.PI / 2; mesh.position.set((FX[0] + FX[2]) / 2, waterY + 0.4, -(FX[1] + FX[3]) / 2); mesh.receiveShadow = true;

})();
(function bakeCanopy() {
  const W = CW, H = CH, c = coreC, x = coreX;
  const ao = document.createElement('canvas'); ao.width = 1024; ao.height = Math.round(1024 * H / W); const a = ao.getContext('2d');
  a.fillStyle = '#fff'; a.fillRect(0, 0, ao.width, ao.height); a.fillStyle = 'rgba(0,0,0,0.085)';
  const sx = ao.width / (core.extent[2] - core.extent[0]), sy = ao.height / (core.extent[3] - core.extent[1]);
  for (const t of plan) { a.beginPath(); a.arc((t.x - core.extent[0]) * sx, (core.extent[3] - t.y) * sy, Math.max(1.2, t.h * 0.22 * sx), 0, 6.283); a.fill(); }
  x.globalCompositeOperation = 'multiply'; x.filter = 'blur(5px)'; x.drawImage(ao, 0, 0, W, H); x.filter = 'none';
  const baked = new THREE.CanvasTexture(c); baked.colorSpace = THREE.SRGBColorSpace; baked.anisotropy = renderer.capabilities.getMaxAnisotropy();
  coreMesh.material.map = baked; coreMesh.material.needsUpdate = true;
})();

// ── sky, sun, haze (a physically based sky like the engines' Sky Atmosphere) ──
const sky = new Sky(); sky.scale.setScalar(240000); scene.add(sky);
Object.assign(sky.material.uniforms.turbidity, { value: 4 });
sky.material.uniforms.rayleigh.value = 1.6; sky.material.uniforms.mieCoefficient.value = 0.004; sky.material.uniforms.mieDirectionalG.value = 0.82;
const sun = new THREE.DirectionalLight(0xffffff, 3.2);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -2600, right: 2600, top: 2600, bottom: -2600, near: 10, far: 20000 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 1.2;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbcd3ff, 0x2a2418, 0.55); scene.add(hemi);
scene.fog = new THREE.FogExp2(0xc9cfd6, 0.00002);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function setSun(hour) {
  const k = (hour - 6) / 14;
  const elev = Math.max(1.5, 64 * Math.sin(Math.PI * k));
  const az = 90 + k * 180;   // east in the morning, west in the evening
  const phi = THREE.MathUtils.degToRad(90 - elev), theta = THREE.MathUtils.degToRad(az);
  const dir = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
  dir.set(Math.sin(theta) * Math.sin(phi), Math.cos(phi), -Math.cos(theta) * Math.sin(phi));
  sky.material.uniforms.sunPosition.value.copy(dir);
  sun.position.copy(dir).multiplyScalar(8000); sun.target.position.set(0, 0, 0);
  const warm = THREE.MathUtils.clamp(1 - elev / 30, 0, 1);
  sun.color.setRGB(1, 1 - warm * 0.28, 1 - warm * 0.55);
  sun.intensity = 0.6 + 3 * Math.min(1, elev / 25);
  hemi.intensity = 0.25 + 0.45 * Math.min(1, elev / 25);
  scene.fog.color.setRGB(0.78 - warm * 0.05, 0.8 - warm * 0.14, 0.84 - warm * 0.3);
  // the sky lights the scene too: its reflection in the water, its tint on everything
  clearTimeout(setSun.env);
  setSun.env = setTimeout(() => {
    if (envRT) envRT.dispose();
    const skyScene = new THREE.Scene(); const s2 = new Sky(); s2.scale.setScalar(1000); s2.material.uniforms = sky.material.uniforms; skyScene.add(s2);
    envRT = pmrem.fromScene(skyScene); scene.environment = envRT.texture;
  }, 120);
  const hh = Math.floor(hour), mm = Math.round((hour - hh) * 60);
  document.getElementById('todv').textContent = (hh % 12 || 12) + ':' + String(mm).padStart(2, '0') + (hh < 12 ? 'a' : 'p');
}
const tod = document.getElementById('tod'), wind = document.getElementById('wind'), haze = document.getElementById('haze');
const setHaze = () => { scene.fog.density = 0.000004 + Number(haze.value) * 0.00004; document.getElementById('hazev').textContent = Math.round(haze.value * 100) + '%'; };
const setWind = () => { uniforms.uWind.value = Number(wind.value); document.getElementById('windv').textContent = Math.round(wind.value * 100) + '%'; };
const cloud = document.getElementById('cloud'); const setCloud = () => { U.uCloud.value = Number(cloud.value); document.getElementById('cloudv').textContent = Math.round(cloud.value / 0.6 * 100) + '%'; };
cloud.oninput = setCloud; setCloud();
tod.oninput = () => setSun(Number(tod.value)); wind.oninput = setWind; haze.oninput = setHaze;
setSun(Number(tod.value)); setWind(); setHaze();

// ── places, labelled ──
const tags = meta.landmarks.map((lm) => {
  const el = document.createElement('div'); el.className = 'tag'; el.textContent = lm.name; document.body.appendChild(el);
  const [x, y] = lm.xy;
  const gy = sampleHeight(x, y);
  return { el, pos: new THREE.Vector3(x, gy + (lm.peak ? 250 : 60), -y) };
});
function sampleHeight(x, y) {
  for (const [hh, gr, ext] of [[coreH, core.grid, core.extent], [farH, far.grid, far.extent]]) {
    if (x < ext[0] || x > ext[2] || y < ext[1] || y > ext[3]) continue;
    const i = Math.round((x - ext[0]) / (ext[2] - ext[0]) * (gr[0] - 1)), j = Math.round((ext[3] - y) / (ext[3] - ext[1]) * (gr[1] - 1));
    return hh[j * gr[0] + i];
  }
  return 0;
}

// ── views: fly the camera between them ──
const lm = Object.fromEntries(meta.landmarks.map((l) => [l.name, l]));
const at = (name, up = 0) => { const [x, y] = lm[name].xy; return new THREE.Vector3(x, sampleHeight(x, y) + up, -y); };
const focus = (meta.landmarks.find((l) => l.focus) || meta.landmarks[0]).name;
const across = (meta.landmarks.find((l) => !l.focus && !l.peak) || meta.landmarks.find((l) => !l.focus) || { name: focus }).name;
const peakAt = (() => { let b = 0; for (let k = 1; k < farH.length; k++) if (farH[k] > farH[b]) b = k;
  const i = b % far.grid[0], j = Math.floor(b / far.grid[0]);
  const x = far.extent[0] + i / (far.grid[0] - 1) * (far.extent[2] - far.extent[0]), y = far.extent[3] - j / (far.grid[1] - 1) * (far.extent[3] - far.extent[1]);
  return new THREE.Vector3(x, farH[b], -y); })();
const away = (from, to, dist, rise) => { const d = to.clone().sub(from).setY(0); if (d.lengthSq() < 1) d.set(1, 0, 0); d.normalize(); return from.clone().addScaledVector(d, -dist).add(new THREE.Vector3(0, rise, 0)); };

  gorge: () => ({ pos: away(at(focus), at(across), 2600, 900), target: at(across, 200) }),

let fly = null;
function go(name) {
  const v = views[name]();

}
document.getElementById('goClose').onclick = () => go('bridge');
if (FALLS.length) document.getElementById('goClose').textContent = FALLS.slice().sort((a, b) => b.h - a.h)[0].name;
document.getElementById('goAcross').onclick = () => go('gorge');
document.getElementById('goBack').onclick = () => go('hood');
document.getElementById('goAcross').textContent = 'Toward ' + across;
const v0 = views.bridge(); camera.position.copy(v0.pos); controls.target.copy(v0.target); controls.update();

document.getElementById('facts').innerHTML =
  `${plan.length.toLocaleString()} trees in 4 species, forest streamed in around you to the horizon · ${ferns.length.toLocaleString()} ferns and shrubs · ${meta.trees.measured.toLocaleString()} trees measured by laser<br>` + (bridge ? `bridge found in the data: ${Math.round(bridge.a.distanceTo(bridge.b))} m, deck ${Math.round(bridge.deck - waterY)} m over the river<br>` : "") +
  `tallest: ${Math.min(80, meta.trees.tallest_m)} m · ground: ${meta.sources.ground}<br>` +
  `photo: ${meta.sources.core_photo} · distance: ${meta.sources.far_photo}`;
document.getElementById('about').textContent = (meta.core.lidar_share > 0.02
  ? 'Where the US laser survey has flown, every tree stands where it found one, at its measured height; elsewhere trees grow from the photo\'s green, with estimated heights.'

  + ' ' + (PROFILE.summary || 'Each tree is grown from a species recipe and chosen by rule: broadleaves by the water, conifers up the slopes, ferns at their roots.');

  + (FALLS.length ? ' · ' + FALLS.length + ' waterfall' + (FALLS.length > 1 ? 's' : '') : '')

const composer = null;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock(), v = new THREE.Vector3();
